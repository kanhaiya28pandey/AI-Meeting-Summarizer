spring.application.name=ai-meeting-summarizer-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meeting_summarizer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:60000}
ai.service.read-timeout=${AI_SERVICE_READ_TIMEOUT:300000}

app.upload.temp-dir=${TEMP_UPLOAD_DIR:./temp/uploads}

spring.servlet.multipart.max-file-size=${MAX_AUDIO_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_REQUEST_SIZE:105MB}

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

meeting.processing.core-pool-size=${MEETING_PROCESSING_CORE_POOL_SIZE:2}
meeting.processing.max-pool-size=${MEETING_PROCESSING_MAX_POOL_SIZE:4}
meeting.processing.queue-capacity=${MEETING_PROCESSING_QUEUE_CAPACITY:20}
meeting.processing.thread-name-prefix=meeting-processing-
