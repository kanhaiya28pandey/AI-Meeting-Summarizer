# Isolated Test Configuration
spring.application.name=ai-meeting-summarizer-backend-test

# Database configuration for tests (uses environment variables or safe defaults, isolated from production)
spring.datasource.url=${TEST_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/meeting_summarizer}}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Test temp upload directory inside target to ensure automatic cleanup
app.upload.temp-dir=target/test-temp/uploads

# Mockable AI service settings for tests
ai.service.url=${TEST_AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout=2000
ai.service.read-timeout=5000

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

meeting.processing.core-pool-size=2
meeting.processing.max-pool-size=4
meeting.processing.queue-capacity=20
meeting.processing.thread-name-prefix=test-meeting-proc-
