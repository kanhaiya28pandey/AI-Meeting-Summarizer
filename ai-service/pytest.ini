[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    live_ai: marks tests as requiring real Gemini API key (opt-in only via RUN_LIVE_AI_TESTS=true)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
